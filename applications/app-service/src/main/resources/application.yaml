server:
  port: 8080
spring:
  application:
    name: "LogiFlowShipmentService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  data:
    mongodb:
      uri: mongodb+srv://@logiflow.ejlg4zj.mongodb.net/logiflow?appName=logiflow
      database: logiflow
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
